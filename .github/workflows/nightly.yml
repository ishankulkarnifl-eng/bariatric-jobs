name: Nightly job scan

on:
  schedule:
    - cron: "20 9 * * *"   # 09:20 UTC ≈ 5:20 AM ET, before her morning
  workflow_dispatch: {}     # manual "Run now" button in the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BRIGHTDATA_KEY: ${{ secrets.BRIGHTDATA_KEY }}
          USAJOBS_KEY: ${{ secrets.USAJOBS_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python -m pipeline.run

      - name: Commit updated data and site
        run: |
          git config user.name "jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.json docs/index.html
          git diff --cached --quiet || git commit -m "nightly scan $(date -u +%F)"
          git push
